<p><font color="#0000FF"><big><strong>Question:&nbsp; </strong></big></font></p>

<p><strong>Do I need to take specific classes (high school) to qualify for admissions to
Ricks College?</strong></p>

<p><font color="#0000FF"><big><strong>&nbsp;</strong></big></font></p>

<p><font color="#0000FF"><big><strong>Answer:&nbsp; </strong></big></font></p>

<p><strong>Ricks does not have specific courses requirements.&nbsp; We do look at high
school graduation, GPA, ACT scores, as well as church and seminary acitivity.</strong></p>
