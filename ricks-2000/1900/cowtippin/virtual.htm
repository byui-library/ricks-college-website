<html>

<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="GENERATOR" content="Microsoft FrontPage 3.0">
<title>Virtual Cow Tipping</title>
<SCRIPT LANGUAGE="JavaScript">
function cowtip()
{
	if(document.myform.picturesource.value == "up")
	{
		document.cow.src = "down.jpg"
		document.myform.picturesource.value = "down"
	}
	else
   {
		document.cow.src = "up.jpg"
		document.myform.picturesource.value = "up"
	}
}

</script>
</head>

<body>

<form name="myform">
  <input type="hidden" name="picturesource" value="up"><div align="center"><center><p><a
  href="javascript:cowtip()"><img src="up.jpg" width="381" height="255" name="cow"
  border="0"><br>
  Click to tip the cow</a><br>
  </p>
<embed name="soundfile" width="128" height="128" src="cow.wav" hidden>
  </center></div>
</form>

<p align="center"><a href="javascript:cowtip()"><br>
</a></p>
</body>
</html>
