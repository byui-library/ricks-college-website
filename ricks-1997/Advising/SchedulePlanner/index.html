      function isValid( majorString )
      //Purpose: checks for a major number consisting of three digits
      {
         var majorNumberRegExp = /\d{3}/;
         return( majorNumberRegExp.test( majorString ) );
      }
      function checkMajor()
      {
      //Purpose: confirms that a major has been selected
         var majorIndex
         var flag = false
         
         for ( i = 0; i < 5; i++ )
         {
            majorIndex = document.aasp.MAJORNUM[ i ].selectedIndex;
         
            if( isValid( document.aasp.MAJORNUM[ i ][ majorIndex ].value ) )
            {
               flag = true
               
               if ( i == 4 )
                  document.aasp.SPECIALIZED.value = 1;
               else
                  document.aasp.SPECIALIZED.value = 0;
               
               break;   
            }
         }
         if ( !flag )
         {
            alert("Please check your selection!");
         }
         
         return flag;
      }
      // -->
