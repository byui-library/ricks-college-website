<h2><a name="baseball camp">Baseball Camp</a></h2>

<blockquote>
    <p>Baseball Camp (grades 5-12) June 5-7, 1997</p>
</blockquote>

<dl>
    <dt>Boys will improve baseball skills by receiving
        individulalized instruction from Ricks College coaches
        and team members. Special features of this camp include:</dt>
</dl>

<ul>
    <li>Opportunities to improve fundamental skills, e.g.
        hitting, fielding, throwing </li>
    <li>Participation in exciting games </li>
    <li>Receive camp t-shirt and ball </li>
</ul>

<blockquote>
    <p>Tuition: $100<br>
    Lunch will be provided. </p>
</blockquote>

<p><a href="#sports">Sports Camps Main Menu</a> </p>

<h2><a name="boys basketball">Boys Basketball Camps</a></h2>

<blockquote>
    <p>Elementary Basketball Camp (grades 4-7) June 9-13, 1997<br>
    Junior Basketball Camp (grades 8-9) June 16-20, 1997<br>
    Senior Basketball Camp (grades 10-12) June 23-27, 1997</p>
</blockquote>

<dl>
    <dt>These popular basketball camps will give boys the chance
        to receive professional individualized instruction by
        Ricks College coaches and team members. Young men will
        strengthen their skills and make new friends during their
        week-long camp experience. The camp also includes the
        following special features: </dt>
</dl>

<ul>
    <li>Specific skill stations </li>
    <li>Exciting competition games </li>
    <li>Awards for champions in individual and team contests </li>
    <li>Camp t-shirt and camp ball for all participants </li>
</ul>

<blockquote>
    <p>Tuition: $135<br>
    Meals and Housing: $87<br>
    Lunch and Dinner Meals Only: $36 </p>
</blockquote>

<p><a href="#sports">Sports Camps Main Menu</a> </p>

<hr>

<h2><a name="wrestling">Wrestling</a></h2>

<blockquote>
    <p>Boys Wrestling Camp (grades 5-12) June 30-July 4, 1997</p>
</blockquote>

<p>Boys will be taught by two-time Olympic gold medalist John
Smith and other outstanding national-class wrestlers. Boys will
receive wrestling instruction at its best. Special features of
the camp include: </p>

<ul>
    <li>National class coaches and wrestlers as staff </li>
    <li>Individual help and skill development </li>
    <li>Proven techniques used in international competitions </li>
    <li>Camp t-shirt for all participants </li>
</ul>

<blockquote>
    <p>Tuition: $160<br>
    Meals and Housing: $87<br>
    Lunch and Dinner Meals Only: $36 </p>
</blockquote>

<p><a href="#sports">Sports Camps Main Menu</a> </p>

<hr>

<h2><a name="cross country">Cross Country</a></h2>

<blockquote>
    <p>Boys and Girls Cross Country Camp (grades 7-12) July
    21-25, 1997</p>
</blockquote>

<dl>
    <dt>Youth will learn what it takes to be a successful
        distance runner. Ricks College Coach Doug Stutz, the 1995
        and 1996 NJCAA National Coach of the Year, will be the
        primary instructor. The camp includes the following
        special features: </dt>
</dl>

<ul>
    <li>Theory and practice of distance running </li>
    <li>Camp t-shirt for all participants </li>
    <li>Nutrition, training theory, mental training and holistic
        approach to training </li>
</ul>

<blockquote>
    <p>Tuition: $135<br>
    Meals and Housing: $87<br>
    Lunch and Dinner Meals Only: $36 </p>
</blockquote>

<p><a href="#sports">Sports Camps Main Menu</a> </p>
