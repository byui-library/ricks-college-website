    </font><font face="Verdana" size="1">by Alfred, Lord Tennyson<br>

    <a href="https://web.archive.org/web/1998/http://www.ricks.edu/Ricks/employee/HACKWORTHA/tennyson/the_eagle.mp3">with a

  <tr>
    <td width="100%"><p align="center"><strong><font face="Verdana" size="3"><br>
    He clasps the crag with crooked hands;<br>
    Close to the sun in lonely lands,<br>
    Ringed with the azure world, he stands.<br>
    <br>
    The wrinkled sea beneath him crawls;<br>
    He watches from his mountain walls,<br>
    And like a thunderbolt he falls.<br>
    <br>
    </font></strong></td>
