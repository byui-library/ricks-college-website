<!--Good Work! Texture Volcanic (Extrusive) Plutonic (Intrusive) Classification Color Index Main Minerals Quartz, Orthoclase, Biotite, and Amphibole Plagioclase and Amphibole Plagioclase, Pyroxene and Olivine Pyroxene and Olivine Phaneritic Aphanitic Granite Diorite Gabbro Peridotite Rhyolite Andesite Basalt Vesicular Pumice Scoria Glassy Obsidian Pyroclastic Fragmental Can be any  composition or color Tuff: Angular fragments larger           than 2mm. Volcanic Breccia: Angular fragments larger                                than 2mm. This is where the basalt text  will go, Pyroclastic rocks are  classified on the basis of the  size of the rock fragments  which make up the bulk of the  sample.  Volcanic ash is  composed of dust and sand  sized pyroclastic fragments  less than 2mm in diameter.   Most ash is made of glass  shards from the walls of  pumice bubbles which have  burst during explosive  eruptions. Next you must determine  which of the four possibilities  in the phaneritic row the rock  corresponds to.  To do this  you need to determine what  it's mineral composition is.   Look for clues like the color,  luster, cleavage, striations and  shapes of different minerals in  the rock.  In this rock the white  mineral with well developed  cleavage is K-feldspar; the  gray, glassy looking mineral  with no cleavage is biotite.   Considering it's mineral  composition, determine which  is the correct name for this  rock on the phaneritic row of  the table.  Drag the rock to the  proper box on the table. Most glassy rocks are of  rhyolitic composition and are  called  obsidian .  Rhyolitic  rocks form glassy textures  more commonly than basaltic  rocks because they are more  viscous and their crystals  grow more slowly. Now, try the same procedure  with another rock.  This rock is  made of coarse grains of gray  plagioclase (good cleavage  and striations) and black  pyroxene.  Drag the rock to  the proper box on the table Composed mostly of coarser  fragments (>2mm) Rhyolite text will go here. Frothy rocks which are highly  vesicular (usually composed  of more than 50% vesicles)  have special names.  Such  particular rock is of rhyolitic  composition. This is where the andesite text  will go. The main minerals in this rock  are glagioclase (gray) and  amphibole (black with shiny  cleavage). Frothy rocks which are highly  vesicular (usually composed  of more than 50% vesicles)  have special names.  This  sample is of basaltic  composition. Since you cannot see the  minerals in aphanitic rocks  you must approximate its  composition based on the  color of the sample.  Since  rhyolites are made mostly of  felsic (light colored) minerals  they tend to be light colored  like white, pink, or light brown  or gray.  Basaltic rocks have a  higher proportion of mafic  (dark colored) minerals and  are usually black or dark grey.   Andesites contain roughly  equal proportions of felsic and  mafic minerals and are  therefore intermediate in  color: usually gray. brown,  red, or green. Good Work! Texture Volcanic (Extrusive) Plutonic (Intrusive) Classification Color Index Main Minerals Quartz, Orthoclase, Biotite, and Amphibole Plagioclase and Amphibole Plagioclase, Pyroxene and Olivine Pyroxene and Olivine Phaneritic Aphanitic Granite Diorite Gabbro Peridotite Rhyolite Andesite Basalt Vesicular Pumice Scoria Glassy Obsidian Pyroclastic Fragmental Can be any  composition or color Tuff: Angular fragments larger           than 2mm. Volcanic Breccia: Angular fragments larger                                than 2mm. This is where the basalt text  will go, Pyroclastic rocks are  classified on the basis of the  size of the rock fragments  which make up the bulk of the  sample.  Volcanic ash is  composed of dust and sand  sized pyroclastic fragments  less than 2mm in diameter.   Most ash is made of glass  shards from the walls of  pumice bubbles which have  burst during explosive  eruptions. Next you must determine  which of the four possibilities  i
