<P><CENTER>"FAIRE" SONG</CENTER>
</P>

<BR WP="BR1"><BR WP="BR2">
<P>Qui peut faire de la voile sans vent</P>

<P>Qui peut ramer sans rame?</P>

<P>Et qui peut quitter son ami (e)</P>

<P>Sans  verser des larmes?</P>

<BR WP="BR1"><BR WP="BR2">
<P>Je peux faire de la voile sans vent</P>

<P>Je peux ramer  sans rame</P>

<P>Mais ne peut quitter mon ami</P>

<P>Sans verser des larmes</P>
