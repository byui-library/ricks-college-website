<p>FOLLOWING THE PROPHET</p>
<p>&quot;It is not important that a prophet should say those things with which
you and I are in full accord.&nbsp; But it is important that you and I should
bring ourselves into full accord with those things which a prophet speaks by
virtue of his office and calling.&quot;</p>
<p>Richard L. Evans</p>
