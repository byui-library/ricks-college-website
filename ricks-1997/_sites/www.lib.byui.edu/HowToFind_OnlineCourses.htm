      <p><b>How to Find Online Courses</b></p>
      <p>Online Courses can be accessed from the Library Home Page by selecting 
        Quick Links and then clicking on <a href="../courses.byui.edu/default.htm" target="_top">Online 
        Courses</a>. Online Courses can also be accessed from the BYU-Idaho home

        of the screen.</p>
