<base target="main">
<script>
//THIS IS THE JAVASCRIPT PORTION OF THE CODE WHICH 
//PROVIDES FUNCTIONALITY TO THE LIST OF COURSES IT
//BREAKS DOWN THE STRING SENT FROM THE COURSE LIST
//INTO THE "DEPARTMENT PREFIX" AND "COURSE NUMBER"
//AND CONVERTS IT INTO A STRING THAT CAN BE SENT IN
//THE URL TO THE "Display.asp" PAGE
function go(form)
{
   DPCN = form.nav.options[form.nav.selectedIndex].value;

   // **IF THE STRING FROM THE COURSE LIST IS BLANK CHANGE THE "main" FRAME TO THE DEFAULT PAGE ("Main.htm")**
   if(DPCN == "None")
   {
        parent.main.location = "Main.htm"
   }

   // **IF THE STRING FROM THE COURSE LIST IS NOT BLANK BREAK IT DOWN AND SEND IT TO "Display.adp"**
   else
   {        
        // **SETS THE "start" VARIABLE TO THE BEGINNING OF THE STRING**
        var start = DPCN.charAt(1);

        // **SETS THE "end" VARIABLE TO THE END OF THE STRING**
        var end = DPCN.indexOf(" ");

        // **STORE THE DEPARTMENT PREFIX IN THE "DeptP" VARIABLE**
        var DeptP = DPCN.substring(start,end);

        // **SETS THE "start" and "end" VARIABLES TO THE START OF THE COURSE NUMBER AND THE END OF THE STRING**
        var start = DPCN.length; 
        end=end+3;

        // **STORE THE COURSE NUMBER IN THE CourseN VARIABLE**
        var CourseN = DPCN.substring(end,start);

	 // **REPLACES THE "&" WITH A "~" SO IT DOES NOT MESS UP THE URL**
	 DeptP=DeptP.replace(/&/gi, "~");
	 CourseN=CourseN.replace(/ /gi, "+");
        
        // **CHANGES THE LOCATION OF THE "main" FRAME TO DISPLAY THE SELECTED COURSE     
        parent.main.location =  "Display.asp?DP=" + DeptP + "&CN=" + CourseN;
   }
}
</script>
