<script language="JavaScript1.2">

var delay=6500 
var fcontent=new Array()
begintag='<font face="Lucida Sans, Arial MT, Lucidas, Arial Narrow" size=2 color=silver>' 
fcontent[0]="The Percussion Program at Brigham Young University-Idaho is designed to:"
fcontent[1]="Prepare the percussion major with the skills and experiences essential to succeed in the professional world of percussion."
fcontent[2]="Provide a rich vocational percussion experience for the amateur percussionist who wishes to play for the inherent joy of playing."
fcontent[3]="Provide a rewarding introductory experience in percussion for the beginner who is interested in exploring the experiences of the percussion world."
fcontent[4]="Whatever your special interests, previous experience, or current ability, there is a place for you in the BYU-Idaho percussion program to give you the training, personal growth, and ensemble experience you are seeking."
fcontent[5]="There are many opportunities for percussionists to perform with the various wind, string, and vocal ensembles on campus."
closetag='</font>'

var fwidth=500 //set scroller width
var fheight=70 //set scroller height


var ie4=document.all&&!document.getElementById
var ns4=document.layers
var DOM2=document.getElementById
var faderdelay=0
var index=0

if (DOM2)
faderdelay=2000

//function to change content
function changecontent(){
if (index>=fcontent.length)
index=0
if (DOM2){
document.getElementById("fscroller").style.color="rgb(255,255,255)"
document.getElementById("fscroller").innerHTML=begintag+fcontent[index]+closetag
colorfade()
}
else if (ie4)
document.all.fscroller.innerHTML=begintag+fcontent[index]+closetag
else if (ns4){
document.fscrollerns.document.fscrollerns_sub.document.write(begintag+fcontent[index]+closetag)
document.fscrollerns.document.fscrollerns_sub.document.close()
}

index++
setTimeout("changecontent()",delay+faderdelay)
}


frame=20;
hex=255  

function colorfade() {	         	

if(frame>0) {	
hex-=12; // increase color value
document.getElementById("fscroller").style.color="rgb("+hex+","+hex+","+hex+")"; // Set color value.
frame--;
setTimeout("colorfade()",20);	
}
else{
document.getElementById("fscroller").style.color="rgb(0,0,0)";
frame=20;
hex=255
}   
}

if (ie4||DOM2)
document.write('<div id="fscroller" style="width:'+fwidth+';height:'+fheight+';padding:2px"></div>')

window.onload=changecontent
</script>


<ilayer id="fscrollerns" width=&{fwidth}; height=&{fheight};>
