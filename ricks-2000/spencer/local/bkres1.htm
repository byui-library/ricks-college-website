<html>

<head>
<meta http-equiv="Content-Type" content="text/html; charset=windows-1252">
<title>Reserve Your Textbooks Now</title>
<meta name="GENERATOR" content="Microsoft FrontPage 3.0">
<meta http-equiv="refresh"
content="130;URL=https://web.archive.org/web/2001/https://www.ricks.edu/spencer/local/studentlogin.asp">
</head>

<body>

<form METHOD="POST" onsubmit="return false">
  <table border="0" cellPadding="0" cellSpacing="0" width="100%">
    <tr>
      <td></td>
      <td align="middle" colspan="2"><h2>Textbook Reservation</h2>
      <p>Note: This is for Fall Semester 2000 Only</td>
      <td></td>
    </tr>
    <tr>
      <td align="left"><a href="REGI.HTM">Return to Menu</a></td>
      <td align="middle" colspan="2"><a href="StudentLogin.asp">Exit before leaving this
      computer</a></td>
      <td align="right"><input id="button1" name="button1" onclick="history.go(-1)"
      type="button" value="Back"> </td>
    </tr>
    <tr>
      <td colspan="4"><hr>
      </td>
    </tr>
    <tr>
      <td>Student ID: <input TYPE="password" NAME="IDNO" SIZE="9" maxlength="9"></td>
      <td>PIN Number: <input TYPE="PASSWORD" NAME="PIN" SIZE="5" maxlength="5"> </td>
      <td><div align="left"></div></td>
      <td><a href="https://web.archive.org/web/2001/http://www.ricks.edu/spencer/local/whytext.htm">Why reserve Texbooks?</a></td>
    </tr>
    <tr>
      <td><br>
      <select NAME="NEWUSED" size="2">
        <option value="N">Only New books </option>
        <option value="U">Used books when available </option>
      </select></td>
      <td><dl>
        <dd align="center"><br>
          <select NAME="CHK" size="3">
            <option VALUE="R">Reserve Books </option>
            <option VALUE="C">Check reservation status </option>
            <option VALUE="N">Do not Reserve Books </option>
          </select></dd>
      </dl>
      </td>
      <td><input type="submit" value="Submit"></td>
      <td></td>
    </tr>
  </table>
</form>
</body>
</html>
