var msg = new Array();
Stamp = new Date();
today = Stamp.getDate();
msg[1] = "<p>Time sure is fun when you're having flies!</p><p><i>Kermit the Frog</i></p>";
msg[2] = "<p>Blind obedience doesn't exist in accordance with the gospel, we do not obey because we are blind, we obey because we can see</p><p><i>Neal A. Maxwell</i></p>";
msg[3] = "<p>It is better to wear out, than to rust out</p><p><i>Elder LeGrand Richards</i></p>";
msg[4] = "<p>My philosophy is to stop putting question marks behind the Prophet's statements and to put exclamation marks instead</p><p><i>Elder Russell M. Nelson</i></p>";
msg[5] = "<p>If i task is once begun, Never stop until it's done.  Be it great or be it small, do it well or not at all</p>";
msg[6] = "<p>If God seems so far away, who has moved?</p>";
msg[7] = "<p>The time will come when no man will be able to live on borrowed light.  Each will have to be guided by the light within himself.  If you do not have it, you will not be able to stand</p><p><i>Heber C. Kimball</i></p>";
msg[8] = "<p>Thought for a new year--No matter what your past has been, you have a spotless future</p><p><i>Hugh B. Brown</i></p>";
msg[9] = "<p>The best reason for holding your chin up when in trouble is that it keeps your mouth closed</p><p><i>Tveon Boyett</i></p>";
msg[10] = "<p>All that is gold does not glitter, Not all those who wander are lost, The old that are strong does not wither, Deep roots are not reached by the frost</p><p><i>J.R.R. Tolkien</i></p>";
msg[11] = "<p>Beware the half--truth, you may have gotten hold of the wrong half</p>";
msg[12] = "<p>Sometimes the Lord calms the storm, sometimes He lets the storm rage and calms the child</p>";
msg[13] = "<p>Our families are not yet ours.  The Lord has committed them to us to see how we will treat them.  Only if we are faithful will they be given to us forever.  What we do on earth determines whether or not we will be worthy to become Heavenly Parents</p><p><i>Brigham Young</i></p>";
msg[14] = "<p>The rest of your days depends on the rest of your nights!</p>";
msg[15] = "<p>I shall be telling this with a sigh somewhere ages and ages hence--Two roads diverged in a wood, and I...I took the one less traveledby, and that has made all the difference.</p><p><i>Robert Frost</i></p>";
msg[16] = "<p>The chains of habit are too light to be felt until they are too strong to be broken</p>";
msg[17] = "<p>If you haven't chosen the Kingdom of God first, it will make no difference in the end what you have chosen instead</p><p><i>Elder Neal A. Maxwell</i></p>";
msg[18] = "<p>All that is required for evil to win is for good men to do nothing!</p><p><i>Edmund Burke</i></p>";
msg[19] = "<p>As if you could kill time with out injuring eternity!</p><p><i> Henry David Thoureau</i></p>";
msg[20] = "<p>He who knows not that he knows not--is a fool, shun him.  He who knows that he knows not--is seeking, teach him.  He who knows not that he knows--is asleep, awake him.  He who knows that he knows--is a wise man, follow him</p>";
msg[21] = "<p>This work of reactivation is done one soul at a time, quietly and with dignity...and if some bristle a bit, then let us learn how to pat a porcupine</p><p><i>Neal A. MAxwell</i></p>";
msg[22] = "<p>There are three types of people in this world--Those who make things happen--Those who watch things happen--And those who wonder what happened</p>";
msg[23] = "<p>Therefore the only true measure of greatness is how close a man can become like Jesus.  That man is greatest who is most like Christ, and those who love Him most will be most like Him</p><p><i>Pres. Ezra Taft Benson</i></p>";
msg[24] = "<p>The deeper that I delve into the sciences of this universe, the more firmly do I believe that one God, or force, or influence, has organized all of it for our discovery</p><p><i>Albert Einstein</i></p>";
msg[25] = "<p>It's a rather dull person who can't think of at least two ways to spell a word</p><p><i>Andrew Jackson</i></p>";
msg[26] = "<p>Everyman has secret sorrows that the world knows not, and oftentimes we call a man cold when he is only sad</p><p><i>Longfellow</i></p>";
msg[27] = "<p>Most of the shadows of this day are caused by men standing in their own sunshine</p><p><i>Ralph Waldo Emerson</i></p>";
msg[28] = "<p>If you graduated yesterday, and learned nothing today, tomorrow you would be uneducated.</p>";
msg[29] = "<p>The mass of men worry themselves into nameless graves, while here and there a great unselfish soul forgets himself into immortality</p><p><i>Ralph Waldo Emerson</i></p>";
msg[30] = "<p>Seven days without prayer makes one weak!</p>";
msg[31] = "<p>Things turn out best for the people who make the best of the way things turn out</p><p><i>Ty Boyd</i></p>";

function writeTip() { 
document.write(msg[today]);
