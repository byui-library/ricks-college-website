<SCRIPT LANGUAGE="JavaScript">
var timerID = null
var timerRunning = false
var graduation = new Date (2001, 3, 28, 8, 45, 0) // April 28, 2001 8:45 AM
function stopCounter ()
{
   if (timerRunning)
      clearInterval (timerID)
   timerRunning = false
}
function startCounter ()
{
   // Make sure the counter is stopped
   stopCounter ()
   timerID = setInterval ("showDelta ()", 1000)
   timerRunning = true
   document.counter.graduation.value = graduation.toLocaleString ()
}
function showDelta ()
{
   var now = new Date ()
   document.counter.current.value = now.toLocaleString ()
   var delta = graduation.getTime () - now.getTime ()
   delta /= 1000  // get rid of milliseconds giving us seconds
   seconds = Math.floor (delta) % 60
   delta = Math.floor (delta / 60)  // get rid of seconds giving us minutes
   minutes = delta % 60
   delta = Math.floor (delta / 60)  // get rid of minutes giving us hours
   hours = delta % 24
   days = Math.floor (delta / 24)  // whatever is left must be days
   var timeValue = days + " days "
   timeValue += hours + " hours "
   timeValue += minutes + " minutes "
   timeValue += seconds + " seconds "
   document.counter.countDown.value = timeValue
}
</SCRIPT>
