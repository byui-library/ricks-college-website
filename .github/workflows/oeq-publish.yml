name: Publish to openEQUELLA

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: oeq-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  publish-to-oeq:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Publish content to openEQUELLA
        uses: byui-oeq/oe-github/master-action@main
        with:
          metadata_file: metadata.json
          mapping_file: oeq-mapping.json
          repo_project_id: ${{ github.repository_id }}
        env:
          OEQ_BASE_URL: ${{ secrets.OEQ_BASE_URL }}
          OEQ_OAUTH_CLIENT_ID: ${{ secrets.OEQ_OAUTH_CLIENT_ID }}
          OEQ_OAUTH_CLIENT_SECRET: ${{ secrets.OEQ_OAUTH_CLIENT_SECRET }}
          OEQ_X_WAF_BYPASS: ${{ secrets.OEQ_X_WAF_BYPASS }}
          OEQ_NETID: ${{ vars.OEQ_NETID }}
