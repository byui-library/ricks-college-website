<h2 align="center"><em>The most important knowledge in the world is gospel knowledge.
&nbsp; It is knowledge from God and his laws, of those things that men must do to work out
their salvation with fear and trembling before the Lord.</em></h2>

<h3 align="center">(President Joseph F. Smith,<em> Ensign,</em> May 1971, pp.2-3)<em> </em></h3>
