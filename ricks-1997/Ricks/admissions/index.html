<script language="JavaScript">

self.name = "user";

function getCookie(name) {
    dc = document.cookie;
    if (dc.length>0 && (cut1=dc.indexOf(name))>=0) {
        tmp = dc.substring(cut1+name.length+1);
        cut2=tmp.indexOf(';');
        if (cut2<0)
            tmp2 = tmp;
        else
            tmp2 = tmp.substring(0,cut2);
        return unescape(tmp2);
    }
    return null;
}

function setCookie (name, value) {

    document.cookie = name + "=" + escape (value) + "; path=/";
}

function openWebPubWindow()
{

	var url = top.location.href;
 	var baseURL = url.substring(0, url.lastIndexOf('/'));

	setCookie('baseURL', baseURL);
	if (navigator.appName == "Microsoft Internet Explorer" ||
 	((navigator.appName == "Netscape" && parseInt(navigator.appVersion) == 3) &&
 	navigator.javaEnabled())) {
          // the applet version should be the old (non-signed-applet) one
          webPubWin = window.open( "/publisher/WPConsole30.html", "webpubwin",
          "status=yes,width=600,height=200,menubar=no,location=no,directories=no,"+
                "menubar=no,scrollbars=no,resizable=no" );
        } else if(( navigator.appName == "Netscape" &&
        parseInt(navigator.appVersion) == 4) && navigator.javaEnabled()) {
          // the applet is being launched as a sigend applet
          webPubWin = window.open( "/publisher/WPConsole.html", "webpubwin",
                "status=yes,width=600,height=200,menubar=no,location=no,directories=no,"+
                "menubar=no,scrollbars=no,resizable=no" );
        } else {
                // no approved setup was detected
                if( parseInt(navigator.appVersion) == 2 ){
                        alert("The Web Publisher cannot be run from Navigator version 2!");
                } else if( navigator.javaEnabled() == false ){
                        alert("The Web Publisher can only be run when Java is enabled!" );
                } else {
                        alert("Web Publisher cannot start: unknown problem with browser type!" );
                }
        }
}

function AccessControl() 
{
